{% extends "base.html" %}
{% block titulo %} Slider {% endblock %}

{% block css %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/slider.css') }}">
{% endblock %}

{% block contenido %}
    <h2 class="text-2xl font-bold text-center my-4">Slider de Imágenes</h2>

    <div class="relative w-4/5 md:w-3/5 mx-auto overflow-hidden rounded-xl shadow-lg">
        <div id="slider-track" class="flex transition-transform duration-500 ease-in-out">
            <div class="min-w-full">
                <img src="{{ url_for('static', filename='img/imagen01.jpg') }}" alt="Imagen 1" class="w-full h-72 object-cover">
            </div>
            <div class="min-w-full">
                <img src="{{ url_for('static', filename='img/imagen02.jpg') }}" alt="Imagen 2" class="w-full h-72 object-cover">
            </div>
            <div class="min-w-full">
                <img src="{{ url_for('static', filename='img/imagen03.jpg') }}" alt="Imagen 3" class="w-full h-72 object-cover">
            </div>
        </div>

        <button onclick="cambiarSlide(-1)" class="absolute top-1/2 left-2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full hover:bg-black/70">&#10094;</button>
        <button onclick="cambiarSlide(1)" class="absolute top-1/2 right-2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full hover:bg-black/70">&#10095;</button>

        <div id="slider-dots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-2"></div>
    </div>
{% endblock %}

{% block js %}
    <script src="{{ url_for('static', filename='js/slider.js') }}"></script>
{% endblock %}
